[features-introduction-two]
other = "Возможности"

[features-introduction-three]
other = "для получения дополнительной информации"

[zfs-title]
other = "Нативная ZFS"

[zfs-description]
other = "является выдающейся платформой хранения, объединяющей функциональность традиционных файловых систем, менеджеров томов и не только. FreeBSD — одна из немногих операционных систем, предоставляющая её как полностью интегрированную функцию, что избавляет от необходимости беспокоиться при обновлениях системы."

[virtualization-title]
other = "Виртуализация"

[virtualization-description-one]
other = "FreeBSD поставляется с"

[virtualization-description-two]
other = ", многофункциональным гипервизором типа 2. bhyve поддерживает оборудование virtio, проброс PCI и высокопроизводительный эмулируемый NVMe. Запускайте"

[virtualization-description-three]
other = "напрямую или используйте инструменты вроде"

[virtualization-description-four]
other = "для упрощения управления виртуальными машинами."

[jails-title]
other = "Jails"

[jails-description-one]
other = "позволяют разделить нагрузку вашей системы в изолированных окружениях. Хотите запустить веб-сервер с собственной изолированной файловой системой и сетью? Поместите его в jail. Используйте встроенную команду"

[jails-description-two]
other = "или альтернативные инструменты, чтобы упростить управление jail."

[networking-title]
other = "Сетевые возможности"

[networking-description]
other = "Технологическая индустрия давно знает FreeBSD за превосходную производительность сети. Сегодня глобально значимые компании полагаются на производительность и стабильность сетевого стека FreeBSD для обработки самых требовательных нагрузок в мире."

[documentation-title]
other = "Документация"

[documentation-description-one]
other = "FreeBSD гордится всеобъемлющей, хорошо написанной документацией. Существует специальный"

[documentation-description-two]
other = "портал"

[documentation-description-three]
other = ", и, что ещё важнее, она является частью самой операционной системы."

[community-title]
other = "Сообщество"

[community-description-one]
other = "Сообщество FreeBSD"

[community-description-two]
other = "сообщества"

[community-description-three]
other = " активно и сотрудничает. Группы активны на многих площадках, от общения в реальном времени до списков рассылки и групп новостей. Обязательно ознакомьтесь с деятельностью сообщества, поддерживаемой"

[community-description-four]
other = "Фондом FreeBSD."

