[zfs-title]
other = "Native ZFS"

[zfs-description]
other = "is an outstanding storage platform that encompasses the functionality of traditional filesystems, volume managers, and more. FreeBSD is one of the few operating systems to offer it as a fully integrated feature, meaning you won’t have to worry during system upgrades."

[virtualization-title]
other = "Virtualization"

[virtualization-description-one]
other = "FreeBSD comes with"

[virtualization-description-two]
other = ", a feature-rich type 2 hypervisor. bhyve supports virtio hardware, PCI passthrough, and high-performance emulated NVMe. Run"

[virtualization-description-three]
other = "directly, or leverage tools like"

[virtualization-description-four]
other = "to simplify management of virtual machines."

[jails-title]
other = "Jails"

[jails-description-one]
other = "enable you to partition your system’s workload within isolated environments. Want to run a web server with its own isolated file system and networking? Put it in a jail. Use the built-in"

[jails-description-two]
other = "command or leverage alternative tools to make jail management trivial."

[networking-title]
other = "Networking"

[networking-description]
other = "The technology industry has long known FreeBSD for its excellent networking performance. Today, globally significant companies rely on the performance and stability of FreeBSD’s network stack to handle some of the most demanding loads in the world."

[documentation-title]
other = "Documentation"

[documentation-description-one]
other = "FreeBSD prides itself on having comprehensive, well-written documentation. There’s the dedicated"

[documentation-description-two]
other = "portal"

[documentation-description-three]
other = ", and perhaps more importantly, it is a part of the operating system itself."

