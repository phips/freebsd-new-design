<h4>{{ i18n "errata-notices" }}</h4>
{{ $errataCounter := 0 }}
{{ with .Site.Data.security.errata }}
  {{ range (sort .notices "date" "desc") }}
    {{ if lt $errataCounter 2 }}
      <p>
        <span>{{ .date }}</span>
        <br />
        <a href="{{ $.Site.BaseURL }}security/advisories/{{ .name }}.asc">{{ .name }}</a>
      </p>
    {{ end }}
    {{ $errataCounter = add $errataCounter 1 }}
  {{ end }}
{{ end }}
<div class="feed-source">
  <a href="{{ "security/notices/" | relLangURL }}">{{ i18n "more" }}</a> |
  <a href="{{ "security/feed.xml" | relURL }}" title={{ i18n "rss" }}>
    <img class="rssimage" src="{{ absLangURL ($.Site.BaseURL) }}images/rss_icon.png" alt={{ i18n "rss" }} width="27" height="12" />
  </a>
</div>
